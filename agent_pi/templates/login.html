<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Login | Agent Pi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    .card h1 { font-size: 1.4rem; margin-bottom: 0.3rem; color: #58a6ff; }
    .card p  { font-size: 0.85rem; color: #8b949e; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: #58a6ff; }
    .btn {
      width: 100%;
      padding: 0.65rem;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn:hover { background: #2ea043; }
    .alert {
      background: #3d0a0a;
      color: #f85149;
      border: 1px solid #f85149;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .register-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #8b949e;
    }
    .register-link a { color: #58a6ff; text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎓 Agent Pi</h1>
    <p>Sign in with your university credentials.</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>University ID</label>
        <input type="text" name="university_id" placeholder="e.g. S001" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="register-link">
      Don't have an account? <a href="/register">Register here</a>
    </div>
  </div>
</body>
</html>
