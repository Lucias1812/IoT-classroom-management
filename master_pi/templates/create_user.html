{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block heading %}Create Account{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <h2>Create New Account</h2>

  {% if error %}
    <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="form-group">
      <label>University ID</label>
      <input type="text" name="university_id" placeholder="e.g. SEC002" required/>
    </div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="full_name" placeholder="Full name" required/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="email@example.com" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required/>
    </div>
    <div class="form-group">
      <label>Role</label>
      <select name="role">
        <option value="security">Security Staff</option>
        <option value="user">User (Student/Teacher)</option>
      </select>
    </div>
    <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
      <button type="submit" class="btn btn-primary">Create Account</button>
      <a href="/users" class="btn" style="background:#21262d; color:#e6edf3;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
