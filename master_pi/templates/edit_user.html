{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block heading %}Edit User{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <h2>Edit Account — {{ user.university_id }}</h2>

  <form method="POST">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="full_name" value="{{ user.full_name }}" required/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" value="{{ user.email }}" required/>
    </div>
    {% if user.role != 'admin' %}
    <div class="form-group">
      <label>Role</label>
      <select name="role">
        <option value="user"     {% if user.role == 'user'     %}selected{% endif %}>User</option>
        <option value="security" {% if user.role == 'security' %}selected{% endif %}>Security Staff</option>
      </select>
    </div>
    {% endif %}
    <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/users" class="btn" style="background:#21262d; color:#e6edf3;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
