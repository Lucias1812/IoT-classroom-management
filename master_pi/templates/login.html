<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Admin Login | Master Pi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 {
      font-size: 1.4rem;
      margin-bottom: 0.3rem;
      color: #58a6ff;
    }
    .login-card p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: #58a6ff; }
    .btn {
      width: 100%;
      padding: 0.65rem;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn:hover { background: #2ea043; }
    .alert {
      background: #3d0a0a;
      color: #f85149;
      border: 1px solid #f85149;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .note {
      font-size: 0.75rem;
      color: #484f58;
      text-align: center;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🏛 Master Pi</h1>
    <p>Admin access only. Log in with your admin credentials.</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="university_id">University ID</label>
        <input type="text" id="university_id" name="university_id"
               placeholder="e.g. ADMIN" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <p class="note">This interface is restricted to administrators only.</p>
  </div>
</body>
</html>
