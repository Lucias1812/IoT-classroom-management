<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Report Fault | Room {{ room_id }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }
    h2 { font-size: 1.3rem; margin-bottom: 0.3rem; }
    p  { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.5rem; }
    textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus { outline: none; border-color: #58a6ff; }
    .btn {
      display: inline-block;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 0.75rem;
      text-decoration: none;
    }
    .btn-danger  { background: #b91c1c; color: #fff; }
    .btn-back    { background: #21262d; color: #e6edf3; margin-left: 0.5rem; }
    .alert-success { background: #1a4731; color: #3fb950; border: 1px solid #3fb950;
                     border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
    .alert-error   { background: #3d0a0a; color: #f85149; border: 1px solid #f85149;
                     border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚠️ Report Room Fault</h2>
    <p>Describe the issue so security staff can be notified immediately.</p>

    {% if success %}
      <div class="alert-success">✅ Fault reported successfully. Security staff have been notified.</div>
      <a href="/display" class="btn btn-back">← Back to Display</a>
    {% else %}
      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <textarea name="issue" placeholder="Describe the fault (e.g. projector not working, AC making noise)" required></textarea>
        <div>
          <button type="submit" class="btn btn-danger">Submit Fault Report</button>
          <a href="/display" class="btn btn-back">Cancel</a>
        </div>
      </form>
    {% endif %}
  </div>
</body>
</html>
